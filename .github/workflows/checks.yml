name: checks

# check-adrs: repo-wide invariant that docs/decisions/ and its index agree, and every ADR
# citation pins its ADR's current rev. ruff/pytest: the uv project's own lint and test suite.
# None of these are required-status-check contexts (repository-floor.yml names only
# check-branch, pr-title and repo-floor); these are the repo's own invariant gates, same pinned
# wise-ci/setup-uv actions WiseGncDesign's checks.yml and WiseKiosk's docs-and-hygiene job run.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-adrs:
    name: check-adrs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: WisewareOrg/wise-ci/check-adrs@a51ce6032a02e26df62c9ced07fb9e4ca1c36a0b

  check-hosting-generic:
    name: check-hosting-generic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: sim/basilisk/hosting/ carries no algorithm-specific vocabulary
        run: scripts/check-hosting-generic.sh

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      # WiseGncDesign and WiseGncAnalysis are checked out as sibling directories (see
      # README.md): gnc-algorithms and gnc-analysis are editable path dependencies on them, not
      # pinned sources. Both siblings are needed here, not just for pytest: `uv sync --locked`
      # resolves the whole lockfile, including the dev group, for either job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: WiseDynamics
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WisewareOrg/WiseGncDesign
          path: WiseGncDesign
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WisewareOrg/WiseGncAnalysis
          path: WiseGncAnalysis
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - working-directory: WiseDynamics
        run: uv sync --locked
      - working-directory: WiseDynamics
        run: uv run ruff check .
      - working-directory: WiseDynamics
        run: uv run ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: WiseDynamics
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WisewareOrg/WiseGncDesign
          path: WiseGncDesign
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WisewareOrg/WiseGncAnalysis
          path: WiseGncAnalysis
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # The scenario is SPICE-free, so no support-data download is needed.
      - working-directory: WiseDynamics
        run: uv sync --locked
      - working-directory: WiseDynamics
        run: uv run pytest
      # testpaths restricts the step above to tests/; sim/basilisk/scenarios is a separate,
      # explicit invocation that exercises its own conftest.py options.
      - working-directory: WiseDynamics
        run: uv run pytest sim/basilisk/scenarios -n 4 --runs 8 --out campaign-out
