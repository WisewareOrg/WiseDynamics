name: checks

# The jobs are described in CONTRIBUTING.md's "CI checks" section.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-adrs:
    name: check-adrs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: WisewareOrg/wise-ci/check-adrs@63ae1c90f30257964989acce75abde1e886823a9

  check-python:
    name: check-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - run: uv sync --locked --all-extras
      - uses: WisewareOrg/wise-ci/check-python@63ae1c90f30257964989acce75abde1e886823a9

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - run: uv sync --locked --all-extras
      - run: uv pip install --no-deps "wise-dynamics @ git+file://${GITHUB_WORKSPACE}@${GITHUB_SHA}"
      # --no-sync, or uv run re-syncs and puts the editable checkout back over the pin; the variable makes the
      # suite fail if it does.
      - run: uv run --no-sync pytest
        env:
          WISE_DYNAMICS_EXPECT_INSTALL: pinned
