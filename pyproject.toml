[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Simulation host for Wiseware's GNC work: Basilisk scenarios and the Monte Carlo campaigns run over them, exporting runs the analysis package's loader reads."
requires-python = ">=3.12"
dependencies = [
    "bsk[all]",
    "numpy",
    "h5py",
    "gnc-algorithms[basilisk,analysis]",
]

[tool.uv.sources]
# WiseGncDesign is a sibling checkout (see README.md): an editable path dependency, not a pin,
# so WiseDynamics always builds against whatever revision is checked out there. The analysis
# and basilisk extras above both resolve against this same checkout, which carries gnc_cdh,
# gnc_algorithms and gnc_analysis together.
gnc-algorithms = { path = "../WiseGncDesign", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
