[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Basilisk spacecraft vehicle models and the scenarios that place them, with a pytest plugin that runs each Monte Carlo case as a pytest test."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wiseware" }]
requires-python = ">=3.12"
dependencies = [
    "bsk[all]~=2.12.1",
    "numpy>=2.0",
    "h5py>=3.11",
    "pytest>=9.1.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
notebook = [
    "ipython>=9.18.1",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.6",
    "pytest-xdist>=3.6",
    "tqdm>=4.67.3",
]

[project.entry-points.pytest11]
wisedynamics = "wise_dynamics.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wise_dynamics"]

[dependency-groups]
dev = [
    "interrogate>=1.7.0",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "pydoclint>=0.12.0",
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.interrogate]
fail-under = 100
verbose = 1

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-short-docstrings = false
allow-init-docstring = true
