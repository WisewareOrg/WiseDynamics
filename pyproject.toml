[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Simulation host for Wiseware's GNC work: Basilisk scenarios and Monte Carlo campaigns exporting to the WiseGncAnalysis data contract."
requires-python = ">=3.12"
dependencies = [
    "bsk[all]",
    "numpy",
    "pandas",
    "gnc-algorithms",
]

[project.scripts]
wise-mc-imu = "sim.basilisk.campaigns.imu_dead_reckoning_mc:main"

[tool.uv.sources]
# WiseGncDesign is a sibling checkout (see README.md): an editable path dependency, not a pin,
# so WiseDynamics always builds against whatever WiseGncDesign revision is checked out there.
gnc-algorithms = { path = "../WiseGncDesign", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
