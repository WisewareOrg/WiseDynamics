[project]
name = "wise-dynamics"
version = "0.1.0"
description = "A reusable Basilisk plant library: static spacecraft/sensor models, a one-case runner, a §2 HDF5 run writer, and a pytest plugin exposing Monte Carlo options and fixtures, with no flight-software dependency."
requires-python = ">=3.12"
dependencies = [
    "bsk[all]",
    "numpy",
    "h5py",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
