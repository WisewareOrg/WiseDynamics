[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Basilisk spacecraft vehicle models and the scenarios that place them, with a pytest plugin that runs each Monte Carlo case as a pytest test."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wiseware" }]
requires-python = ">=3.12"
dependencies = [
    "bsk[all]~=2.12.1",
    "numpy>=2.0",
    "h5py>=3.11",
    "pytest>=9.1.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
notebook = [
    "ipython>=9.18.1",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.6",
    "pytest-xdist>=3.6",
    "tqdm>=4.67.3",
]

[project.entry-points.pytest11]
wisedynamics = "wise_dynamics.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wise_dynamics"]

[dependency-groups]
dev = [
    "check-python",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "pytest-xdist>=3.6",
]

[tool.uv]
# bsk caps Pillow at 12.2.0, below its security fixes. Basilisk never imports Pillow; matplotlib
# and bokeh, which do, accept 13. Drop the override once a Basilisk release lifts the cap.
override-dependencies = ["pillow>=13"]

[tool.uv.sources]
check-python = { git = "https://github.com/WisewareOrg/wise-ci", subdirectory = "check-python", rev = "d2483ccf39ccce58ccfbaa75d3d1c6466ff6701e" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"
