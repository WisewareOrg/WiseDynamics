[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Basilisk spacecraft plant models, a one-case runner, an HDF5 run writer and a pytest plugin for Monte Carlo campaigns."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wiseware" }]
requires-python = ">=3.12"
dependencies = [
    "bsk[all]~=2.12.1",
    "numpy>=2.0",
    "h5py>=3.11",
    "pytest>=9.1.1",
]

[project.entry-points.pytest11]
wisedynamics = "wise_dynamics.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wise_dynamics"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
