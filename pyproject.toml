[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Simulation host for Wiseware's GNC work: Basilisk scenarios and Monte Carlo campaigns exporting to the WiseGncAnalysis data contract."
requires-python = ">=3.12"
dependencies = [
    "bsk[all]",
    "numpy",
    "pandas",
    "gnc-algorithms",
]

[project.scripts]
wise-mc-imu = "sim.basilisk.campaigns.imu_dead_reckoning_mc:main"

[tool.uv.sources]
# WiseGncDesign PR #4, frozen head: the ImuDeadReckoner(sigma0_BN, r0_N, v0_N, t0, mu) interface
# per SPEC-demo.md §1. The smoke tests, the 8-run check, and the 852-run campaign in the PR body
# were all run against this exact rev.
gnc-algorithms = { git = "https://github.com/WisewareOrg/WiseGncDesign", rev = "14aa03a3ac044b6f9a4d7a3e22c51c66ac1db935" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
