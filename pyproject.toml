[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Simulation host for Wiseware's GNC work: Basilisk scenarios and Monte Carlo campaigns exporting to the WiseGncAnalysis data contract."
requires-python = ">=3.12"
dependencies = [
    "bsk[all]",
    "numpy",
    "pandas",
    "gnc-algorithms",
]

[tool.uv.sources]
# WiseGncDesign and WiseGncAnalysis are sibling checkouts (see README.md): editable path
# dependencies, not pins, so WiseDynamics always builds against whatever revision of each is
# checked out there.
gnc-algorithms = { path = "../WiseGncDesign", editable = true }
gnc-analysis = { path = "../WiseGncAnalysis", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
    # gnc-analysis: a dev-only dependency so a campaign export can be checked against
    # WiseGncAnalysis's real contract.v0.check_campaign, not a restated assumption about it.
    "gnc-analysis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
