[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Simulation host for Wiseware's GNC work: Basilisk scenarios and Monte Carlo campaigns exporting to the WiseGncAnalysis data contract."
requires-python = ">=3.12"
dependencies = [
    "bsk[all]",
    "numpy",
    "pandas",
    "gnc-algorithms",
]

[project.scripts]
wise-mc-imu = "sim.basilisk.campaigns.imu_dead_reckoning_mc:main"

[tool.uv.sources]
# PLACEHOLDER: awaiting the new WiseGncDesign commit implementing SPEC-demo.md §1's
# ImuDeadReckoner(sigma0_BN, r0_N, v0_N, t0, mu) interface (f74f70b implements a superseded,
# attitude-plus-delta-V-only interface -- see task #6 discussion). Do not `uv lock` against this
# rev; team-lead will send the real SHA.
gnc-algorithms = { git = "https://github.com/WisewareOrg/WiseGncDesign", rev = "PLACEHOLDER-awaiting-spec-section1-sha" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
