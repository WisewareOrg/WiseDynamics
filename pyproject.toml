[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Basilisk spacecraft vehicle models and the scenarios that place them, with a pytest plugin that runs each Monte Carlo case as a pytest test."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wiseware" }]
requires-python = ">=3.12"
dependencies = [
    "bsk[all]==2.12.2",
    "numpy>=2.0",
    "h5py>=3.11",
    "pytest>=9.1.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
notebook = [
    "ipython>=9.18.1",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.6",
    "pytest-xdist>=3.6",
    "tqdm>=4.67.3",
]

[project.entry-points.pytest11]
wisedynamics = "wise_dynamics.pytest_plugin"

[build-system]
# bsk-sdk provides the headers of the Basilisk the integrator links, bsk its libdynamicsLib.so; every
# requirement is pinned exactly, cmake and ninja below, since uv does not lock the build environment.
requires = ["scikit-build-core==1.1.2", "bsk==2.12.2", "bsk-sdk==2.12.2"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["wise_dynamics"]
cmake.version = "==4.4.5"
ninja.version = "==1.13.2"
# Kept unstripped, so memray names the integrator's frames when a test holds it to no allocation.
install.strip = false

[dependency-groups]
dev = [
    "check-python",
    "ipykernel>=7.4.0",
    "memray>=1.20.0",
    "nbclient>=0.11.0",
    "pytest-xdist>=3.6",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "native/**" }]
# bsk caps Pillow at 12.2.0, below its security fixes. Basilisk never imports Pillow; matplotlib
# and bokeh, which do, accept 13. Drop the override once a Basilisk release lifts the cap.
override-dependencies = ["pillow>=13"]

[tool.uv.sources]
check-python = { git = "https://github.com/WisewareOrg/wise-ci", subdirectory = "check-python", rev = "d1c27c09a689484d023e9f248edbbba6f92fc736" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# An editable install's import hook is imported before pytest, which can then not rewrite it.
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten. _editable_skbc_wise_dynamics:pytest.PytestAssertRewriteWarning",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"
