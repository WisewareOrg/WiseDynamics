[project]
name = "wise-dynamics"
version = "0.1.0"
description = "Simulation host for Wiseware's GNC work: Basilisk scenarios and Monte Carlo campaigns exporting to the WiseGncAnalysis data contract."
requires-python = ">=3.12"
dependencies = [
    "bsk[all]",
    "numpy",
    "pandas",
    "gnc-algorithms",
]

[project.scripts]
wise-mc-imu = "sim.basilisk.campaigns.imu_dead_reckoning_mc:main"

[tool.uv.sources]
# WiseGncDesign PR #4 head (branch task_3-imu_dead_reckoning_package): the amended
# ImuDeadReckoner(sigma0_BN, r0_N, v0_N, t0, mu) interface per SPEC-demo.md §1.
gnc-algorithms = { git = "https://github.com/WisewareOrg/WiseGncDesign", rev = "e60a7b06d63701f3edfb20549f4108dc45cf082c" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
